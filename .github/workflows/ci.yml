name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Droits minimaux du GITHUB_TOKEN pour tous les jobs
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / type-check / build / test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  api:
    name: API Nitro (tests d'intégration sur MySQL jetable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Testcontainers démarre MySQL (Docker est disponible sur ubuntu-latest)
      - name: Tests d'intégration de l'API
        run: pnpm test:api
